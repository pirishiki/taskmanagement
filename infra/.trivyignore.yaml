# Trivy（設計図の防犯診断）で「わざと、このままにする」指摘の一覧（イシュー #63）
# 部品の上に #trivy:ignore:... を書いても効かない指摘だけを、ここに理由と一緒に書く
# 使い方（リポジトリの一番上で）：trivy config --ignorefile infra/.trivyignore.yaml infra
misconfigurations:
  - id: AWS-0178
    paths:
      - "vpc.tf"
    statement: >-
      VPC のフローログ（通信の記録）は取らない。記録の置き場所（CloudWatch Logs）と許可証が増え、
      少しお金もかかるため。練習では取らない（本番なら取る）
