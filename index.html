<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Task Board</h1>

  <div class="board">
    <div class="column" data-status="todo">
      <div class="column-header">
        <h2>やるべきこと</h2>
        <select class="sort-select">
          <option value="" selected>並び替え</option>
          <option value="priority">優先度順</option>
          <option value="dueDate">期限が近い順</option>
        </select>
      </div>
      <div class="card-list" id="todo-list"></div>
      <form class="add-form" data-status="todo">
        <input type="text" class="add-text" placeholder="新しいタスク" required>
        <select class="add-priority">
          <option value="high">高</option>
          <option value="medium" selected>中</option>
          <option value="low">低</option>
        </select>
        <input type="date" class="add-due-date">
        <button type="submit">追加</button>
      </form>
    </div>

    <div class="column" data-status="doing">
      <div class="column-header">
        <h2>進行中</h2>
        <select class="sort-select">
          <option value="" selected>並び替え</option>
          <option value="priority">優先度順</option>
          <option value="dueDate">期限が近い順</option>
        </select>
      </div>
      <div class="card-list" id="doing-list"></div>
      <form class="add-form" data-status="doing">
        <input type="text" class="add-text" placeholder="新しいタスク" required>
        <select class="add-priority">
          <option value="high">高</option>
          <option value="medium" selected>中</option>
          <option value="low">低</option>
        </select>
        <input type="date" class="add-due-date">
        <button type="submit">追加</button>
      </form>
    </div>

    <div class="column" data-status="done">
      <div class="column-header">
        <h2>終わったこと</h2>
        <select class="sort-select">
          <option value="" selected>並び替え</option>
          <option value="priority">優先度順</option>
          <option value="dueDate">期限が近い順</option>
        </select>
      </div>
      <div class="card-list" id="done-list"></div>
      <form class="add-form" data-status="done">
        <input type="text" class="add-text" placeholder="新しいタスク" required>
        <select class="add-priority">
          <option value="high">高</option>
          <option value="medium" selected>中</option>
          <option value="low">低</option>
        </select>
        <input type="date" class="add-due-date">
        <button type="submit">追加</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
