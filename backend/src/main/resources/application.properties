spring.application.name=backend

server.port=8080

# DB の接続先。ドライバ（PostgreSQL 用の部品）と方言（dialect）は、この URL から自動で決まるので書かない
# 接続先・ユーザー名・パスワードは、環境変数 DB_URL・DB_USERNAME・DB_PASSWORD があればそれを使い、
# なければ : のあとの値（手元の Docker の DB）を使う。本番（AWS）では、3 つとも RDS の値を環境変数で渡す
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# テーブルを作る・変えるのは Flyway（src/main/resources/db/migration の V1, V2, … の SQL）
# Hibernate はテーブルを直さず、Task.java とテーブルが合っているかを確かめるだけ（合わなければ起動を止める）
spring.jpa.hibernate.ddl-auto=validate
# Flyway の記録（flyway_schema_history の表）がない、データ入りの DB は「V1 まで済んでいる」とみなし、V1 を流さない
# （Flyway を入れる前から使っている開発用の DB のデータを、消さずにそのまま使うため。空の DB では V1 から普通に流れる）
spring.flyway.baseline-on-migrate=true
# ヘルスチェック（Actuator）の入口を /api/health にする。/api で始まるので、Nginx・Vite の設定を変えずに届く
# 外に見せるのは health だけ。答えは {"status":"UP"} だけで、DB の種類などの中身は見せない（初期設定のまま）
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
# 画面（JSON）を作る段階では DB に触らない。DB の操作は Service の @Transactional の中だけで行う
spring.jpa.open-in-view=false
